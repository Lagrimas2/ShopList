<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gorceryo - Grocery List</title>
    <link rel="stylesheet" href="css folder/style.css">
</head>
<body>
    <!--Grocery List section-->
    <section id="grocerySection">
        <h2>Grocery item list</h2>

        <label>Item name</label>
        <input type="text" id="item_name"><br>

        <label>Quantity</label>
        <input type="number" id="item_qty" min="1"><br>

        <button onclick="addItem()">Add item</button>
        <button onclick="clearList()">Clear list</button>

        <br>
        <button onclick="logout()">Log Out</button>
        <h3>The List</h3>
        <ul id="groceryList"></ul>
    </section>

    <script src="js folder/list.js"></script>
</body>
</html>
