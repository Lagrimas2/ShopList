<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gorceryo - Register</title>
    <link rel="stylesheet" href="css folder/style.css">
</head>
<body>
    <!-- user registration-->
    <section id="registration">
        <h1>Gorceryo user registration</h1>

        <label>First name</label><br>
        <input type="text" id="fname"><br>

        <label>Last name</label><br>
        <input type="text" id="lname"><br>

        <label>Username</label><br>
        <input type="text" id="uname"><br>

        <label>Address</label><br>
        <input type="text" id="address"><br>

        <label>Email address</label><br>
        <input type="text" id="email_address"><br>

        <label>Password</label><br>
        <input type="password" id="password"><br>

        <button onclick="saveUserDetails()">Register</button>

        <p id="regMessage"></p>
    </section>

    <script src="js folder/reg.js"></script>
</body>
</html>
